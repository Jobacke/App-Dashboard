<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" id="viewport-meta" />
  <title>Board</title>
  <meta name="description" content="Zentrales Command-Center für Notizen, Schichttagebuch, Mopped, Gesundheit, ZNA-Navi, Analytics und Wissen." />
  <meta name="theme-color" content="#090b10" id="meta-theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Board" />
  <link rel="manifest" href="manifest.webmanifest?v=21" />
  <link rel="icon" type="image/svg+xml" href="icons/dashboard.svg" />
  <link rel="alternate icon" type="image/png" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png?v=2" />
  <link rel="apple-touch-icon-precomposed" href="icons/apple-touch-icon.png?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css?v=21" />
  <script>
    try {
      const savedTheme = localStorage.getItem('dashboard_theme') || 'dark';
      document.documentElement.dataset.theme = savedTheme;
      document.getElementById('meta-theme-color')?.setAttribute('content', savedTheme === 'light' ? '#f4f6fb' : '#090b10');
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Ambient Background Mesh -->
  <div class="ambient-bg" aria-hidden="true">
    <div class="ambient-orb orb-1"></div>
    <div class="ambient-orb orb-2"></div>
    <div class="ambient-orb orb-3"></div>
    <div class="ambient-grid"></div>
  </div>

  <!-- Top Navigation / Status Bar -->
  <header class="top-bar">
    <div class="top-bar-inner">
      <div class="brand">
        <div class="brand-logo-wrap">
          <img src="icons/dashboard.svg" alt="Board Logo" class="brand-logo" />
          <span class="brand-pulse"></span>
        </div>
        <div class="brand-text">
          <div class="brand-title-row">
            <span class="brand-title">Board</span>
            <span class="version-badge" id="app-version-badge" title="Installierte Board-Version (Tippen zum Prüfen auf Updates)">v1.9.2</span>
          </div>
          <span class="brand-subtitle">vjbackhaus.de Ecosystem</span>
        </div>
      </div>

      <!-- Right Controls: Live Status, View Mode, Theme -->
      <div class="top-actions">
        <button type="button" class="status-pill" id="ping-all-btn" title="Live-Erreichbarkeit aller Apps prüfen">
          <span class="status-dot online" id="global-status-dot"></span>
          <span class="status-label" id="global-status-text">7 Apps Online</span>
        </button>

        <div class="segmented-control" role="group" aria-label="Öffnungsmodus">
          <button type="button" class="seg-btn active" data-launch-mode="tab" title="Apps in neuem Browser-Tab öffnen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            <span>Tab</span>
          </button>
          <button type="button" class="seg-btn" data-launch-mode="cockpit" title="Apps direkt im integrierten Split-Cockpit öffnen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            <span>Cockpit</span>
          </button>
        </div>

        <!-- Compact Filter Popover Button in Header -->
        <div class="filter-popover-wrap" id="filter-popover-wrap">
          <button type="button" class="filter-trigger-btn" id="filter-popover-btn" title="Sichtbare Apps auswählen" aria-expanded="false" aria-haspopup="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/>
              <line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/>
              <line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/>
              <line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>
            </svg>
            <span class="filter-trigger-count" id="filter-trigger-count">7/7</span>
          </button>

          <div class="filter-popover glass-panel" id="filter-popover" hidden role="dialog" aria-label="Sichtbare Apps filtern">
            <div class="filter-popover-header">
              <span class="filter-popover-title">Sichtbare Apps</span>
              <div class="filter-popover-quick">
                <button type="button" class="filter-mini-link" id="filter-select-all">Alle</button>
              </div>
            </div>
            <div class="filter-popover-cats">
              <button type="button" class="filter-cat-pill" data-preset-cat="rettungsdienst">RD</button>
              <button type="button" class="filter-cat-pill" data-preset-cat="performance">Sport &amp; Vital</button>
              <button type="button" class="filter-cat-pill" data-preset-cat="alltag">Alltag</button>
            </div>
            <div class="filter-popover-list" id="filter-popover-list">
              <!-- Populated dynamically with all 7 apps + checkboxes -->
            </div>
          </div>
        </div>

        <button type="button" class="icon-btn" id="theme-toggle" title="Design wechseln (Dark / Light)" aria-label="Design wechseln">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Update Available Banner (prominent clickable bar when a new version is detected) -->
  <button type="button" id="update-banner" class="update-banner" hidden>
    <span class="update-banner-pulse"></span>
    <span class="update-banner-text">
      🔄 Neue Version <strong id="update-version-text"></strong> verfügbar <span id="update-notes-text"></span> – <u>hier klicken zum Laden</u>
    </span>
  </button>

  <!-- Main Content Container -->
  <main class="dashboard-main" id="dashboard-main">
    <!-- Top Section: Clock & Date (1st), Quick Memo (2nd), Checkbox Category Filter (3rd) -->
    <section class="top-widgets-section">
      <!-- 1. Uhrzeit-Spalte ganz oben -->
      <div class="clock-card glass-panel">
        <div class="clock-header">
          <span class="clock-date" id="live-date">Mittwoch, 18. Nov 2026</span>
          <div class="clock-badges">
            <span class="kw-badge" id="kw-badge" title="Aktuelle Kalenderwoche">KW 47</span>
            <span class="clock-tz">MEZ</span>
          </div>
        </div>
        <div class="clock-main-row">
          <div class="clock-time-wrap">
            <span class="clock-time" id="live-time">08:35</span>
            <span class="clock-seconds" id="live-seconds">:00</span>
          </div>
          <div class="clock-footer" id="recent-activity-bar">
            <span class="recent-label">Zuletzt:</span>
            <span class="recent-app-pill" id="last-opened-pill">Bereit zum Start</span>
          </div>
        </div>
      </div>

      <!-- 2. Darunter das Memofenster -->
      <div class="scratchpad-card glass-panel" id="scratchpad-card">
        <div class="scratchpad-header">
          <div class="scratchpad-title-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="scratchpad-icon"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            <span>Schnell-Memo</span>
          </div>
          <div class="scratchpad-actions">
            <span class="scratchpad-saved" id="scratchpad-status">Gespeichert</span>
            <button type="button" class="scratchpad-mic-btn" id="scratchpad-mic-btn" title="Schnell-Memo per Sprache diktieren" aria-label="Schnell-Memo per Sprache diktieren">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" y1="19" x2="12" y2="23"/>
                <line x1="8" y1="23" x2="16" y2="23"/>
              </svg>
            </button>
            <button type="button" class="scratchpad-save-btn" id="scratchpad-done-btn" hidden>Fertig ✓</button>
            <button type="button" id="scratchpad-open-notizen" class="scratchpad-link" title="Notizen-App direkt im Board öffnen">→ Notizen</button>
          </div>
        </div>
        <textarea id="quick-scratchpad" class="scratchpad-input" rows="2" placeholder="Kurze Gedanken, Schicht-Notiz oder To-Do direkt hier festhalten…"></textarea>
        <div class="memo-transfer-bar" id="memo-transfer-bar">
          <span class="memo-transfer-label">Übertragen in Notizen:</span>
          <div class="memo-transfer-btns">
            <button type="button" class="memo-cat-btn cat-dringend" data-memo-cat="Dringend" title="Schnell-Memo in Rubrik 'Dringend' speichern & Feld leeren">
              <span class="memo-cat-dot"></span> dringend
            </button>
            <button type="button" class="memo-cat-btn cat-juh" data-memo-cat="JUH" title="Schnell-Memo in Rubrik 'JUH' speichern & Feld leeren">
              <span class="memo-cat-dot"></span> JUH
            </button>
            <button type="button" class="memo-cat-btn cat-privat" data-memo-cat="Privat" title="Schnell-Memo in Rubrik 'Privat' speichern & Feld leeren">
              <span class="memo-cat-dot"></span> privat
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- Bento App Grid -->
    <section class="apps-section" aria-label="Deine Web-Apps">
      <div class="bento-grid" id="apps-grid">
        <!-- Populated dynamically by js/app.js -->
      </div>
    </section>

    <!-- App Footer with Version & Build Info -->
    <footer class="dashboard-footer">
      <span>Board · <strong id="footer-version">v1.9.2</strong></span>
      <span>·</span>
      <span id="footer-date">Stand 19.11.2026</span>
      <span>·</span>
      <button type="button" class="footer-check-btn" id="footer-update-check">Auf Update prüfen</button>
    </footer>
  </main>

  <!-- Integrated Split-View / App Cockpit Drawer -->
  <aside class="cockpit-drawer" id="cockpit-drawer" aria-hidden="true">
    <div class="cockpit-header">
      <button type="button" class="cockpit-back-btn" id="cockpit-back-board" title="Zurück zum Board (Esc)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        <span>Board</span>
      </button>

      <div class="cockpit-app-info">
        <img src="icons/dashboard.svg" alt="" class="cockpit-app-icon" id="cockpit-icon" />
        <div>
          <h3 class="cockpit-app-title" id="cockpit-title">App Vorschau</h3>
          <span class="cockpit-app-url" id="cockpit-url">https://…</span>
        </div>
      </div>

      <div class="cockpit-app-switcher" id="cockpit-switcher" aria-label="Schnellwechsel im Cockpit"></div>

      <div class="cockpit-controls">
        <button type="button" class="cockpit-btn" id="cockpit-reload" title="App neu laden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>
        </button>
        <button type="button" class="cockpit-btn" id="cockpit-expand" title="Breite umschalten (Split / Vollbild)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        </button>
        <a href="#" target="_blank" rel="noopener" class="cockpit-btn primary" id="cockpit-open-external" title="In eigenem Tab öffnen">
          <span class="cockpit-ext-label">Tab</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        </a>
      </div>
    </div>
    <div class="cockpit-body">
      <div class="cockpit-share-bar" id="cockpit-share-bar" hidden>
        <span class="cockpit-share-label">Notiz zum Weiterleiten bereit</span>
        <div class="cockpit-share-actions">
          <button type="button" class="cockpit-share-primary" id="cockpit-share-trigger">Jetzt teilen ↗</button>
          <button type="button" class="cockpit-share-secondary" id="cockpit-share-copy">Kopieren</button>
          <button type="button" class="cockpit-share-close" id="cockpit-share-dismiss" aria-label="Schließen">✕</button>
        </div>
      </div>
      <div class="cockpit-loader" id="cockpit-loader">
        <div class="spinner"></div>
        <span>Lade Web-App…</span>
      </div>
      <iframe id="cockpit-iframe"
              class="cockpit-iframe"
              title="Integrierte Web-App Ansicht"
              allow="geolocation *; microphone *; camera *; clipboard-read *; clipboard-write *; web-share *; fullscreen *; autoplay *; wake-lock *; bluetooth *"></iframe>
    </div>
  </aside>
  <div class="cockpit-backdrop" id="cockpit-backdrop" hidden></div>

  <!-- Floating MacOS-Inspired Quick Dock -->
  <nav class="floating-dock" aria-label="Schnellstart-Dock">
    <div class="dock-inner" id="dock-inner">
      <!-- Populated dynamically with the 7 app icons -->
    </div>
  </nav>

  <!-- Hidden background bridge iframe for silent Notizen transfer & status -->
  <iframe id="notizen-bridge-iframe" src="https://remembers.vjbackhaus.de/" title="Notizen Hintergrund-Sync" aria-hidden="true" tabindex="-1" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;border:0;left:-9999px;top:-9999px;"></iframe>

  <!-- Toast Notification -->
  <div class="toast-container" id="toast-container" aria-live="polite"></div>

  <script src="js/app.js?v=21"></script>
</body>
</html>
